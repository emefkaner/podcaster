<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141317" />
  <title>podcast3r</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">🎙️</span>
      <h1 id="pageTitle">podcast3r</h1>
    </div>
    <div class="menu-wrap">
      <button id="menuBtn" class="btn ghost small" aria-haspopup="true" aria-expanded="false" aria-label="Menü">☰</button>
      <nav id="menu" class="menu hidden" role="menu">
        <button class="menu-item" data-go="/" role="menuitem">🎙️ Aufnehmen</button>
        <button class="menu-item" data-go="/settings" role="menuitem">⚙️ Einstellungen</button>
        <button class="menu-item" data-go="feed" role="menuitem">📡 RSS-Feed ansehen</button>
        <button class="menu-item danger" data-go="logout" role="menuitem">↩️ Abmelden</button>
      </nav>
    </div>
  </header>

  <main class="app" id="view"><!-- wird per JS gefüllt --></main>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
